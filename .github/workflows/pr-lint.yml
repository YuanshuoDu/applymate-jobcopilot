name: PR Lint
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [master]
permissions:
  contents: read
  pull-requests: write
jobs:
  lint:
    name: PR Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const body = (pr.body || '').trim();
            const branch = pr.head.ref;
            const errors = [];

            // 1. Must reference the issue being closed
            const closes = body.match(/Closes #(\d+)/i);
            if (!closes) {
              errors.push('PR body must contain `Closes #<issue-number>` linking the GitHub issue.');
            }

            // 2. Branch naming: AH2 issues use codex/ah2-<n>-<slug>; everything else uses conventional prefixes
            const isAh2 = /^codex\/ah2-\d+-[a-z0-9-]+$/i.test(branch);
            const isConventional = /^(feat|fix|refactor|chore|docs|test|release)\/[a-z0-9-]+$/i.test(branch);
            if (!isAh2 && !isConventional) {
              errors.push(`Branch \`${branch}\` must be \`codex/ah2-<n>-<slug>\` (AH2 issues) or \`feat|fix|refactor|chore|docs|test|release/<slug>\`.`);
            }

            // 3. Two-layer AC self-check present
            if (!/## Layer 1/i.test(body)) {
              errors.push('PR body must contain `## Layer 1 — Code AC Self-Check` with an AC table (`| AC | Status | Evidence |`).');
            } else if (!/\| *AC1?\s*\|/i.test(body)) {
              errors.push('Layer 1 table must list each AC with Status and Evidence (file:line).');
            }

            if (errors.length === 0) {
              core.info('PR Lint passed.');
              return;
            }

            const msg = `🚫 **PR Lint failed — fix the PR description**\n\n${errors.map(e => `- ${e}`).join('\n')}\n\nEdit the PR description and push again; this check will re-run.`;
            core.setFailed(msg);
            if (context.payload.action === 'opened' || context.payload.action === 'reopened') {
              await github.rest.issues.createComment({
                owner, repo, issue_number: pr.number, body: msg,
              });
            }
