name: Migration rehearsal

on:
  pull_request:
    branches: [master]
    paths:
      - apps/web/prisma/migrations/**
      - apps/web/prisma/schema.prisma
      - docs/migrations/**
      - docs/runbook/backup-restore-v1-legacy.md
      - scripts/migrations/rehearse-v1-cleanup.sh
      - .github/workflows/migration-rehearsal.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-rehearsal:
    name: Synthetic schema rehearsal (PR safe)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run synthetic disposable rehearsal
        run: bash scripts/migrations/rehearse-v1-cleanup.sh --synthetic --report disposable-rehearsal-report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migration-rehearsal-${{ github.run_id }}
          path: disposable-rehearsal-report.md
          if-no-files-found: error

  trusted-current-dump-rehearsal:
    name: Current dump rehearsal (protected operator run)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: staging-migration-rehearsal
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore current approved dump and rehearse
        env:
          SOURCE_DATABASE_URL: ${{ secrets.SOURCE_DATABASE_URL }}
        run: bash scripts/migrations/rehearse-v1-cleanup.sh --report disposable-rehearsal-report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trusted-migration-rehearsal-${{ github.run_id }}
          path: disposable-rehearsal-report.md
          if-no-files-found: error
