name: Agent grounded final PostgreSQL acceptance

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  grounded-final-pg:
    name: Four bound final cases on disposable PostgreSQL and Redis
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: applymate_agent_brain_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d applymate_agent_brain_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply existing migrations to disposable PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/applymate_agent_brain_ci
        run: pnpm --filter @jobcopilot/web exec prisma migrate deploy --schema prisma/schema.prisma
      - name: Generate Web Prisma client for Worker fixtures
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/applymate_agent_brain_ci
        run: pnpm --filter @jobcopilot/web exec prisma generate --schema prisma/schema.prisma
      - name: Build Worker and workspace dependencies
        run: pnpm turbo build --filter=@jobcopilot/worker
      - name: Verify exactly four bound final cases on disposable services
        env:
          CI: "true"
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/applymate_agent_brain_ci
          AGENT_RUNTIME_PG_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/applymate_agent_brain_ci
          AGENT_RUNTIME_PG_TEST_DISPOSABLE: "true"
          AGENT_RUNTIME_PG_TEST_REQUIRED: "true"
          RUN_AGENT_TURN_REDIS_INTEGRATION: "1"
          AGENT_TURN_REDIS_TEST_DISPOSABLE: "true"
          AGENT_TURN_REDIS_TEST_URL: redis://127.0.0.1:6379/15
          REDIS_URL: redis://127.0.0.1:6379/15
          RESULT_PATH: ${{ runner.temp }}/agent-grounded-final-pg.json
        shell: bash
        run: |
          set -euo pipefail
          readonly EXPECTED_PG_URL=postgresql://postgres:postgres@127.0.0.1:5432/applymate_agent_brain_ci
          readonly EXPECTED_REDIS_URL=redis://127.0.0.1:6379/15
          test "$CI" = "true"
          test "$DATABASE_URL" = "$EXPECTED_PG_URL"
          test "$AGENT_RUNTIME_PG_TEST_URL" = "$EXPECTED_PG_URL"
          test "$AGENT_RUNTIME_PG_TEST_DISPOSABLE" = "true"
          test "$AGENT_RUNTIME_PG_TEST_REQUIRED" = "true"
          test "$RUN_AGENT_TURN_REDIS_INTEGRATION" = "1"
          test "$AGENT_TURN_REDIS_TEST_DISPOSABLE" = "true"
          test "$AGENT_TURN_REDIS_TEST_URL" = "$EXPECTED_REDIS_URL"
          test "$REDIS_URL" = "$EXPECTED_REDIS_URL"

          TEST_PATTERN='(?:runs the default canonical brain through BullMQ wait, verifier restart, and exact atomic final publication|restores interactive discovery across a real Worker restart and replays its child dispatch once|replans a canonical discovery Turn from durable child evidence and persists the owner-scoped shortlist|fails an interactive shortlist when its Scout prerequisite fails and cancels dependent work)$'
          pnpm --filter @jobcopilot/worker exec vitest run \
            --no-file-parallelism --maxWorkers=1 --minWorkers=1 \
            --testNamePattern="$TEST_PATTERN" --reporter=default --reporter=json --outputFile.json="$RESULT_PATH" \
            src/runtime/subagents/native-brain-pg.integration.test.ts \
            src/runtime/subagents/task-graph-resume-pg.integration.test.ts

          node - "$RESULT_PATH" <<'NODE'
          const { readFileSync } = require("node:fs")
          const path = require("node:path")
          const report = JSON.parse(readFileSync(process.argv[2], "utf8"))
          const expected = [
            { file: "native-brain-pg.integration.test.ts", title: "runs the default canonical brain through BullMQ wait, verifier restart, and exact atomic final publication" },
            { file: "task-graph-resume-pg.integration.test.ts", title: "restores interactive discovery across a real Worker restart and replays its child dispatch once" },
            { file: "task-graph-resume-pg.integration.test.ts", title: "replans a canonical discovery Turn from durable child evidence and persists the owner-scoped shortlist" },
            { file: "task-graph-resume-pg.integration.test.ts", title: "fails an interactive shortlist when its Scout prerequisite fails and cancels dependent work" },
          ]
          const results = (report.testResults ?? []).flatMap(suite => (suite.assertionResults ?? []).map(test => ({
            file: path.basename(suite.name ?? ""), title: test.title, status: test.status,
          })))
          const selected = expected.map(test => results.filter(result => result.file === test.file && result.title === test.title))
          const exactFourPassed = selected.every(matches => matches.length === 1 && matches[0].status === "passed")
          if (!exactFourPassed || report.numPassedTests !== 4 || report.numFailedTests !== 0) {
            console.error("Grounded-final PG acceptance did not execute and pass exactly the four named cases.")
            console.error(JSON.stringify({ passed: report.numPassedTests, failed: report.numFailedTests,
              expectedCases: selected.map(matches => matches.map(match => match.status)) }))
            process.exit(1)
          }
          console.log("Verified all four named bound-final PG cases passed.")
          NODE
      - name: Preserve structured PG test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-grounded-final-pg-report
          path: ${{ runner.temp }}/agent-grounded-final-pg.json
          if-no-files-found: warn
          retention-days: 1
