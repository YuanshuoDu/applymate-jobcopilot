name: CI
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  types:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck:all
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:all
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Run all tests
        run: pnpm test:all
  agent-runtime-postgres:
    name: Agent runtime PostgreSQL integration
    runs-on: ubuntu-latest
    # This service exists only for this job; migrations and test writes stay in
    # its throwaway database and never use repository/database secrets.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: applymate_agent_brain_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d applymate_agent_brain_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      AGENT_RUNTIME_PG_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/applymate_agent_brain_ci
      AGENT_RUNTIME_PG_TEST_DISPOSABLE: "true"
      AGENT_RUNTIME_PG_TEST_REQUIRED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Apply existing migrations to the disposable PostgreSQL service
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/applymate_agent_brain_ci
        run: pnpm --filter @jobcopilot/web exec prisma migrate deploy --schema prisma/schema.prisma
      - name: Generate Web Prisma client for the Worker usage-route integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/applymate_agent_brain_ci
        run: pnpm --filter @jobcopilot/web exec prisma generate --schema prisma/schema.prisma
      - name: Build Worker workspace before focused test
        run: pnpm turbo build --filter=@jobcopilot/worker
      - name: Verify context compaction snapshot publication on disposable PostgreSQL
        env:
          CI: "true"
          AGENT_RUNTIME_PG_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/applymate_agent_brain_ci
          AGENT_RUNTIME_PG_TEST_DISPOSABLE: "true"
          AGENT_RUNTIME_PG_TEST_REQUIRED: "true"
        run: |
          test "$CI" = "true"
          test "$AGENT_RUNTIME_PG_TEST_REQUIRED" = "true"
          test "$AGENT_RUNTIME_PG_TEST_DISPOSABLE" = "true"
          test -n "$AGENT_RUNTIME_PG_TEST_URL"
          pnpm --filter @jobcopilot/worker exec vitest run src/runtime/context/context-compaction-pg.integration.test.ts
      - name: Verify durable tool-result persistence and owner isolation
        run: pnpm --filter @jobcopilot/worker exec vitest run src/runtime/tools/tool-result-reference-pg.integration.test.ts
      - name: Verify subagent task leases and attempt fencing on disposable PostgreSQL
        run: pnpm --filter @jobcopilot/worker exec vitest run src/runtime/subagents/subagent-store-pg.integration.test.ts
      - name: Verify mailbox task reads under tenant RLS on disposable PostgreSQL
        run: pnpm --filter @jobcopilot/worker exec vitest run src/runtime/coordination.integration.test.ts
      - name: Verify TaskGraph command writes, replay, and tenant lease fencing on disposable PostgreSQL
        run: |
          test "$AGENT_RUNTIME_PG_TEST_REQUIRED" = "true"
          test "$AGENT_RUNTIME_PG_TEST_DISPOSABLE" = "true"
          test -n "$AGENT_RUNTIME_PG_TEST_URL"
          pnpm --filter @jobcopilot/worker exec vitest run src/runtime/subagents/pg-task-graph-command-port.integration.test.ts
      - name: Verify interactive discovery Stop recovery without subagent execution
        env:
          CI: "true"
          AGENT_RUNTIME_PG_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/applymate_agent_brain_ci
          AGENT_RUNTIME_PG_TEST_DISPOSABLE: "true"
          AGENT_RUNTIME_PG_TEST_REQUIRED: "true"
        run: |
          test "$CI" = "true"
          test "$AGENT_RUNTIME_PG_TEST_URL" = "postgresql://postgres:postgres@127.0.0.1:5432/applymate_agent_brain_ci"
          test "$AGENT_RUNTIME_PG_TEST_DISPOSABLE" = "true"
          test "$AGENT_RUNTIME_PG_TEST_REQUIRED" = "true"
          pnpm --filter @jobcopilot/worker exec vitest run src/runtime/subagents/interactive-discovery-stop-pg.integration.test.ts
      - name: Verify TaskGraph proposal, dependency promotion, and parent resume on disposable PostgreSQL/Redis
        env:
          AGENT_TURN_REDIS_TEST_URL: redis://127.0.0.1:6379/15
          AGENT_TURN_REDIS_TEST_DISPOSABLE: "true"
          REDIS_URL: redis://127.0.0.1:6379/15
          AGENT_PLAN_LEDGER_TRACE_ARTIFACT_PATH: ${{ runner.temp }}/task-graph-plan-ledger.json
          AGENT_INTERACTIVE_DISCOVERY_TRACE_ARTIFACT_PATH: ${{ runner.temp }}/interactive-discovery-trace.json
        run: pnpm --filter @jobcopilot/worker exec vitest run src/runtime/subagents/task-graph-resume-pg.integration.test.ts
      - name: Install Chromium for the persisted Plan Ledger browser fixture
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify the Workbench consumes the persisted Worker Plan Ledger trace
        env:
          AGENT_PLAN_LEDGER_TRACE_ARTIFACT_PATH: ${{ runner.temp }}/task-graph-plan-ledger.json
          AGENT_INTERACTIVE_DISCOVERY_TRACE_ARTIFACT_PATH: ${{ runner.temp }}/interactive-discovery-trace.json
        run: pnpm exec playwright test e2e/agent-task-graph-plan.spec.ts
      - name: Verify production Turn dispatch on disposable Redis/BullMQ
        env:
          RUN_AGENT_TURN_REDIS_INTEGRATION: "1"
          AGENT_TURN_REDIS_TEST_DISPOSABLE: "true"
          AGENT_TURN_REDIS_TEST_URL: redis://127.0.0.1:6379/15
        run: pnpm --filter @jobcopilot/worker exec vitest run src/queue/production-bootstrap-redis.integration.test.ts
      - name: Verify production subagent dispatch and durable parent wake on disposable Redis/BullMQ
        env:
          RUN_AGENT_TURN_REDIS_INTEGRATION: "1"
          AGENT_TURN_REDIS_TEST_DISPOSABLE: "true"
          AGENT_TURN_REDIS_TEST_URL: redis://127.0.0.1:6379/15
        run: pnpm --filter @jobcopilot/worker exec vitest run src/queue/production-bootstrap-subagents-redis.integration.test.ts
      - name: Verify durable parent resume across a Worker process restart
        env:
          AGENT_TURN_REDIS_TEST_URL: redis://127.0.0.1:6379/15
          AGENT_TURN_REDIS_TEST_DISPOSABLE: "true"
          REDIS_URL: redis://127.0.0.1:6379/15
        run: pnpm --filter @jobcopilot/worker exec vitest run src/queue/production-bootstrap-process-restart.integration.test.ts
      - name: Verify disconnected Worker event replay through the authenticated SSE route
        if: ${{ !cancelled() }}
        env:
          CI: "true"
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/applymate_agent_brain_ci
          AGENT_RUNTIME_PG_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/applymate_agent_brain_ci
          AGENT_RUNTIME_PG_TEST_DISPOSABLE: "true"
          AGENT_RUNTIME_PG_TEST_REQUIRED: "true"
          PLATFORM_ENV: development
          AGENT_TURN_REDIS_TEST_URL: redis://127.0.0.1:6379/15
          AGENT_TURN_REDIS_TEST_DISPOSABLE: "true"
          REDIS_URL: redis://127.0.0.1:6379/15
          AGENT_WORKER_SSE_TRACE_ARTIFACT_PATH: ${{ runner.temp }}/phase5-worker-sse-reconnect.json
        run: pnpm --filter @jobcopilot/web exec vitest run "src/app/api/agent/sessions/[id]/events/route.worker-reconnect.integration.test.ts"
      - name: Upload redacted Worker-to-SSE reconnect trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-worker-sse-reconnect
          path: ${{ runner.temp }}/phase5-worker-sse-reconnect.json
          if-no-files-found: warn
      - name: Verify dispatch and claim lock order on disposable PostgreSQL
        env:
          AGENT_RUNTIME_PG_TEST_REQUIRED: "true"
        run: pnpm --filter @jobcopilot/worker exec vitest run src/runtime/turns/recovery-scanner-lock-order-pg.integration.test.ts
  lockfile:
    name: Lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
