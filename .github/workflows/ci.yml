          test "$AGENT_RUNTIME_PG_TEST_URL" = "postgresql://postgres:postgres@127.0.0.1:5432/applymate_agent_brain_ci"
          test "$AGENT_RUNTIME_PG_TEST_DISPOSABLE" = "true"
          test "$AGENT_RUNTIME_PG_TEST_REQUIRED" = "true"
          test "$RUN_AGENT_TURN_REDIS_INTEGRATION" = "1"
          test "$AGENT_TURN_REDIS_TEST_URL" = "redis://127.0.0.1:6379/15"
          test "$AGENT_TURN_REDIS_TEST_DISPOSABLE" = "true"
          test "$REDIS_URL" = "$AGENT_TURN_REDIS_TEST_URL"
          pnpm --filter @jobcopilot/worker exec vitest run --no-file-parallelism src/runtime/subagents/durable-child-wait-pg.integration.test.ts
      - name: Verify disconnected Worker event replay through the authenticated SSE route
        if: ${{ !cancelled() }}
        env:
          CI: "true"
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/applymate_agent_brain_ci
          AGENT_RUNTIME_PG_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/applymate_agent_brain_ci
          AGENT_RUNTIME_PG_TEST_DISPOSABLE: "true"
          AGENT_RUNTIME_PG_TEST_REQUIRED: "true"
          PLATFORM_ENV: development
          AGENT_TURN_REDIS_TEST_URL: redis://127.0.0.1:6379/15
          AGENT_TURN_REDIS_TEST_DISPOSABLE: "true"
          REDIS_URL: redis://127.0.0.1:6379/15
          AGENT_WORKER_SSE_TRACE_ARTIFACT_PATH: ${{ runner.temp }}/phase5-worker-sse-reconnect.json
        run: pnpm --filter @jobcopilot/web exec vitest run "src/app/api/agent/sessions/[id]/events/route.worker-reconnect.integration.test.ts"
      - name: Upload redacted Worker-to-SSE reconnect trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-worker-sse-reconnect
          path: ${{ runner.temp }}/phase5-worker-sse-reconnect.json
          if-no-files-found: warn
      - name: Verify dispatch and claim lock order on disposable PostgreSQL
        env:
          AGENT_RUNTIME_PG_TEST_REQUIRED: "true"
        run: pnpm --filter @jobcopilot/worker exec vitest run src/runtime/turns/recovery-scanner-lock-order-pg.integration.test.ts
  custom-agent-role-migration-postgres:
    name: CustomAgentRole migration PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: applymate_custom_agent_role_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d applymate_custom_agent_role_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: "true"
      CUSTOM_AGENT_ROLE_PG_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/applymate_custom_agent_role_ci
      CUSTOM_AGENT_ROLE_PG_TEST_DISPOSABLE: "true"
      CUSTOM_AGENT_ROLE_PG_TEST_REQUIRED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Guard the dedicated disposable PostgreSQL target
        run: |
          test "$CI" = "true"
          test "$CUSTOM_AGENT_ROLE_PG_TEST_URL" = "postgresql://postgres:postgres@127.0.0.1:5432/applymate_custom_agent_role_ci"
          test "$CUSTOM_AGENT_ROLE_PG_TEST_DISPOSABLE" = "true"
          test "$CUSTOM_AGENT_ROLE_PG_TEST_REQUIRED" = "true"
      - name: Apply all migrations to the fresh disposable PostgreSQL database
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/applymate_custom_agent_role_ci
        run: |
          test "$DATABASE_URL" = "postgresql://postgres:postgres@127.0.0.1:5432/applymate_custom_agent_role_ci"
          test "$CUSTOM_AGENT_ROLE_PG_TEST_URL" = "$DATABASE_URL"
          test "$CUSTOM_AGENT_ROLE_PG_TEST_DISPOSABLE" = "true"
          test "$CUSTOM_AGENT_ROLE_PG_TEST_REQUIRED" = "true"
          pnpm --filter @jobcopilot/web exec prisma migrate deploy --schema prisma/schema.prisma
      - name: Verify CustomAgentRole migration and candidate RLS on disposable PostgreSQL
        run: |
          test "$CI" = "true"
          test "$CUSTOM_AGENT_ROLE_PG_TEST_URL" = "postgresql://postgres:postgres@127.0.0.1:5432/applymate_custom_agent_role_ci"
          test "$CUSTOM_AGENT_ROLE_PG_TEST_DISPOSABLE" = "true"
          test "$CUSTOM_AGENT_ROLE_PG_TEST_REQUIRED" = "true"
          pnpm --filter @jobcopilot/web exec vitest run --no-file-parallelism src/__tests__/custom-agent-role-migration.pg.integration.test.ts
  lockfile:
    name: Lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
