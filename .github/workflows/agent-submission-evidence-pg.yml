name: Worker submission evidence PostgreSQL integration

on:
  pull_request:
    paths:
      - .github/workflows/agent-submission-evidence-pg.yml
      - apps/worker/src/queue/application-submission-evidence.ts
      - apps/worker/src/queue/application-submission-evidence.test.ts
      - apps/worker/src/queue/application-submission-evidence-pg.integration.test.ts
      - apps/worker/src/queue/application-submit-fence.ts
      - apps/worker/src/queue/application-submit-fence.test.ts
      - apps/worker/src/db/application-submit-repo.ts
      - apps/worker/src/db/application-task-state.ts
      - apps/worker/src/runtime/approval/pg-store.ts
      - apps/web/src/lib/agent/application-submission-evidence.ts
      - apps/web/src/lib/agent/application-submission-evidence.test.ts
      - apps/web/src/lib/agent/application-submission-evidence-read.ts
      - apps/web/src/lib/agent/application-submission-evidence-read.test.ts
      - apps/web/src/lib/agent/application-task-view.ts
      - apps/web/src/lib/agent/application-task-view.test.ts
      - apps/web/src/app/api/agent/application-tasks/route.ts
      - apps/web/src/app/api/agent/application-tasks/route.test.ts
      - apps/web/src/components/jobs/application-task-model.ts
      - apps/web/src/components/jobs/application-task-model.test.ts
      - apps/web/src/components/jobs/application-task-card.tsx
      - apps/web/src/components/jobs/application-task-card.test.tsx
      - apps/web/src/components/jobs/application-submission-evidence-copy.ts
      - apps/web/src/components/jobs/application-submission-evidence-copy.test.ts
      - apps/web/prisma/schema.prisma
      - apps/web/prisma/migrations/**
      - apps/web/prisma/rls/enable.sql
      - apps/web/prisma/rls/role-grants.sql

permissions:
  contents: read

jobs:
  submission-evidence-pg:
    name: All 13 submission evidence cases on disposable PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: applymate_agent_brain_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d applymate_agent_brain_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply existing migrations to disposable PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/applymate_agent_brain_ci
        run: pnpm --filter @jobcopilot/web exec prisma migrate deploy --schema prisma/schema.prisma
      - name: Generate Web Prisma client for Worker fixtures
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/applymate_agent_brain_ci
        run: pnpm --filter @jobcopilot/web exec prisma generate --schema prisma/schema.prisma
      - name: Build Worker and workspace dependencies
        run: pnpm turbo build --filter=@jobcopilot/worker
      - name: Verify all 13 submission evidence cases on disposable PostgreSQL
        env:
          CI: "true"
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/applymate_agent_brain_ci
          AGENT_RUNTIME_PG_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/applymate_agent_brain_ci
          AGENT_RUNTIME_PG_TEST_DISPOSABLE: "true"
          AGENT_RUNTIME_PG_TEST_REQUIRED: "true"
          REDIS_URL: redis://127.0.0.1:6379/15
          RESULT_PATH: ${{ runner.temp }}/agent-submission-evidence-pg.json
        shell: bash
        run: |
          set -euo pipefail
          readonly EXPECTED_PG_URL=postgresql://postgres:postgres@127.0.0.1:5432/applymate_agent_brain_ci
          readonly EXPECTED_REDIS_URL=redis://127.0.0.1:6379/15
          test "$CI" = "true"
          test "$DATABASE_URL" = "$EXPECTED_PG_URL"
          test "$AGENT_RUNTIME_PG_TEST_URL" = "$EXPECTED_PG_URL"
          test "$AGENT_RUNTIME_PG_TEST_DISPOSABLE" = "true"
          test "$AGENT_RUNTIME_PG_TEST_REQUIRED" = "true"
          test "$REDIS_URL" = "$EXPECTED_REDIS_URL"
          pnpm --filter @jobcopilot/worker exec vitest run \
            --no-file-parallelism --maxWorkers=1 --minWorkers=1 \
            --reporter=default --reporter=json --outputFile.json="$RESULT_PATH" \
            src/queue/application-submission-evidence-pg.integration.test.ts
          node - "$RESULT_PATH" <<'NODE'
          const { readFileSync } = require("node:fs")
          const path = require("node:path")
          const report = JSON.parse(readFileSync(process.argv[2], "utf8"))
          const file = "application-submission-evidence-pg.integration.test.ts"
          const expected = [
            "records current approved submission evidence with an exact local application reference",
            "keeps another nonempty provider reference unavailable instead of treating it as an ATS receipt",
            "writes at most one evidence event for an exact submitted attempt replay",
            "rejects mismatched user, session, and fill-turn bindings",
            "rejects mismatched application-task and job bindings",
            "rejects mismatched approval, constraint, and artifact-hash bindings",
            "rejects mismatched Worker-job and execution bindings",
            "does not project an old Worker attempt after the current attempt changes",
            "does not project when the durable submission attempt is missing",
            "does not project a reserved submission attempt",
            "does not project a failed submission attempt",
            "requires one completed filler and unambiguous queued evidence",
            "allows candidate-role reads of own evidence but denies other-user events and private attempts",
          ]
          const suites = report.testResults ?? []
          const results = suites.flatMap(suite => (suite.assertionResults ?? []).map(test => ({
            file: path.basename(suite.name ?? ""), title: test.title, status: test.status,
          })))
          const exactCases = suites.length === 1 && path.basename(suites[0].name ?? "") === file
            && results.length === expected.length
            && expected.every(title => results.filter(result => result.file === file && result.title === title
              && result.status === "passed").length === 1)
          const exactCounts = report.numTotalTests === 13 && report.numPassedTests === 13
            && report.numFailedTests === 0 && report.numPendingTests === 0 && report.numTodoTests === 0
          if (!exactCases || !exactCounts) {
            console.error("Submission evidence PG acceptance did not execute and pass exactly all 13 named cases.")
            console.error(JSON.stringify({ total: report.numTotalTests, passed: report.numPassedTests,
              failed: report.numFailedTests, pending: report.numPendingTests, todo: report.numTodoTests,
              statuses: results.map(({ title, status }) => ({ title, status })) }))
            process.exit(1)
          }
          console.log("Verified all 13 named submission evidence PostgreSQL cases passed with no skips.")
          NODE
      - name: Preserve structured PostgreSQL test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-submission-evidence-pg-report
          path: ${{ runner.temp }}/agent-submission-evidence-pg.json
          if-no-files-found: warn
          retention-days: 1
