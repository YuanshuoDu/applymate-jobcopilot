name: Harness Contract

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: harness-contract-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HARNESS_SEED: "42"

jobs:
  scripted-contract:
    name: Scripted harness contracts and fault injection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run all scripted contract tests with Node test runner
        working-directory: apps/worker
        shell: bash
        run: pnpm exec node --import tsx --test $(find src/runtime/harness/scripted -name '*.test.ts' -print)
      - name: Upload deterministic harness trace
        uses: actions/upload-artifact@v4
        with:
          name: harness-contract-${{ env.HARNESS_SEED }}
          path: apps/worker/src/runtime/harness/scripted/__artifacts__/harness-contract-${{ env.HARNESS_SEED }}.json
          if-no-files-found: error

  worker-build:
    name: Worker typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build --filter=@jobcopilot/worker
      - run: pnpm --filter @jobcopilot/worker exec tsc --noEmit --skipLibCheck
